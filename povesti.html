<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universul #TAM se construieste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{overflow:hidden;background:#111;color:#fff;font-family:Arial,sans-serif}
.hero{position:relative;height:100vh;display:flex;align-items:center;justify-content:center}
.hero img{position:absolute;inset:0;width:110%;height:110%;object-fit:cover;animation:kenburns 35s ease-in-out infinite alternate}
.overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.15),rgba(0,0,0,.78))}
.content{position:relative;z-index:2;text-align:center;padding:20px}
h1{font-family:'Permanent Marker',cursive;font-size:clamp(42px,6vw,72px);line-height:1.15;text-shadow:0 0 20px #000}
.logo{font-family:'Permanent Marker',cursive;font-size:clamp(52px,7vw,82px);margin:10px 0;animation:glow 6s ease-in-out infinite}
.t{color:#000;-webkit-text-stroke:1px #fff}.a{color:#ffd400}.m{color:#ff4fa3}
p{margin:30px 0;font-size:clamp(20px,2vw,30px)}
a{display:inline-block;padding:14px 28px;border-radius:16px;background:rgba(255,255,255,.12);color:#fff;text-decoration:none;transition:.3s}
a:hover{background:rgba(255,0,0,.25);transform:translateY(-3px)}
@keyframes kenburns{
0%{transform:scale(1) translateX(-2%)}
50%{transform:scale(1.05) translateX(2%)}
100%{transform:scale(1.1) translateX(-1%)}
}
@keyframes glow{
50%{text-shadow:0 0 10px #fff,0 0 25px #ff3b3b}
}
</style>
</head>
<body>
<section class="hero">
<img src="footer.png" alt="">
<div class="overlay"></div>
<div class="content">
<h1>Universul</h1>
<div class="logo">#<span class="t">T</span><span class="a">A</span><span class="m">M</span></div>
<h1>se construieste</h1>
<p>Caramida cu caramida,<br>construim amintiri.</p>
<a href="index.html">← Inapoi in Universul #TAM</a>
</div>
</section>
</body>
</html>
