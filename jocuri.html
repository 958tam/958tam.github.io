<!DOCTYPE html>
<html lang="ro">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jocuri | #TAM</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#111;
color:white;
font-family:Arial,sans-serif;
overflow:hidden;

}

/* HERO */

.hero{

position:relative;

height:100vh;

display:flex;
justify-content:center;
align-items:center;
text-align:center;

overflow:hidden;

}

/* BACKGROUND */

.hero::before{

content:"";

position:absolute;

inset:0;

background:
url("footer.png")
center center/cover no-repeat;

animation:slowZoom 22s ease-in-out infinite alternate;

}

.hero::after{

content:"";

position:absolute;

inset:0;

background:
linear-gradient(
to bottom,
rgba(0,0,0,.20),
rgba(0,0,0,.82)
);

}

/* CONTENT */

.content{

position:relative;

z-index:5;

padding:20px;

max-width:900px;

}

/* TITLE */

.title{

font-family:'Permanent Marker',cursive;

font-size:64px;

line-height:1.2;

text-shadow:
0 0 20px rgba(0,0,0,.9);

opacity:0;

transform:translateY(40px);

animation:titleAppear 1.8s ease forwards;

}

/* MESSAGE */

.message{

margin-top:45px;

font-size:28px;

color:#dddddd;

line-height:1.8;

opacity:0;

transform:translateY(25px);

animation:textAppear 1.5s ease forwards;

animation-delay:1.2s;

}

/* BUTTON */

.back{

display:inline-block;

margin-top:55px;

padding:16px 34px;

border-radius:18px;

background:rgba(255,255,255,.08);

text-decoration:none;

color:white;

font-size:17px;

backdrop-filter:blur(10px);

transition:.35s;

opacity:0;

transform:translateY(20px);

animation:buttonAppear 1.4s ease forwards;

animation-delay:2.2s;

}

.back:hover{

background:rgba(255,0,0,.18);

transform:translateY(-3px);

}

/* ANIMATIONS */

@keyframes titleAppear{

to{

opacity:1;
transform:translateY(0);

}

}

@keyframes textAppear{

to{

opacity:1;
transform:translateY(0);

}

}

@keyframes buttonAppear{

to{

opacity:1;
transform:translateY(0);

}

}

@keyframes slowZoom{

0%{

transform:scale(1);

}

100%{

transform:scale(1.08);

}

}

/* MOBILE */

@media(max-width:700px){

.title{

font-size:42px;

}

.message{

font-size:22px;

margin-top:32px;

}

.back{

margin-top:42px;

}

}

</style>

</head>

<body>

<section class="hero">

<div class="content">

<div class="title">

Universul #TAM<br>se construiește

</div>

<div class="message">

Cărămidă cu cărămidă,<br>
construim amintiri.

</div>

<a href="index.html" class="back">

← Înapoi în Universul #TAM

</a>

</div>

</section>

</body>

</html>
