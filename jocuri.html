<!DOCTYPE html>
<html lang="ro">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Universul #TAM se construieste</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap"
rel="stylesheet">

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;

}

html{

height:100%;

}

body{

min-height:100vh;

overflow-x:hidden;

background:#111;

font-family:Arial,sans-serif;

color:white;

}

/* HERO */

.hero{

position:relative;

width:100%;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}

/* IMAGINE */

.hero-image{

position:absolute;

left:0;

top:0;

width:135%;

height:100%;

object-fit:cover;

object-position:left center;

animation:panorama 52s ease-in-out infinite;

will-change:transform;

}

/* OVERLAY */

.overlay{

position:absolute;

inset:0;

background:

linear-gradient(

to bottom,

rgba(0,0,0,.10),

rgba(0,0,0,.78)

);

z-index:2;

}

/* PARTICULE */

.particles{

position:absolute;

inset:0;

pointer-events:none;

overflow:hidden;

z-index:3;

}

.particle{

position:absolute;

bottom:-20px;

width:5px;

height:5px;

border-radius:50%;

background:rgba(255,255,255,.18);

animation:floatUp linear infinite;

}

/* CONTENT */

.content{

position:relative;

z-index:10;

text-align:center;

padding:30px;

max-width:900px;

}

/* TITLU */

.title{

font-family:'Permanent Marker',cursive;

font-size:66px;

line-height:1.2;

opacity:0;

transform:translateY(40px);

animation:titleFade 1.8s forwards;

}

/* LOGO */

.logo{

margin:18px 0;

font-family:'Permanent Marker',cursive;

font-size:70px;

letter-spacing:2px;

animation:titleGlow 52s linear infinite;

}

.black-t{

color:#000;

-webkit-text-stroke:1px white;

}

.split-a{

background:linear-gradient(

to right,

#ffd400 50%,

#ff2d2d 50%

);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.pink-m{

color:#ff4fa3;

}

/* TEXT */

.message{

margin-top:26px;

font-size:28px;

line-height:1.8;

color:#ececec;

opacity:0;

transform:translateY(30px);

animation:textFade 1.8s forwards;

animation-delay:1s;

}

/* BUTTON */

.back{

display:inline-block;

margin-top:50px;

padding:16px 34px;

border-radius:18px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(10px);

text-decoration:none;

color:white;

font-size:17px;

transition:.35s;

opacity:0;

transform:translateY(20px);

animation:buttonFade 1.5s ease 2s forwards;

}

.back:hover{

background:rgba(255,40,40,.22);

transform:translateY(-3px);

box-shadow:

0 0 25px rgba(255,0,0,.35);

}

  /* PARTICLE POSITIONS */

.particle:nth-child(1){

left:8%;

animation-duration:22s;

animation-delay:0s;

}

.particle:nth-child(2){

left:18%;

animation-duration:27s;

animation-delay:3s;

}

.particle:nth-child(3){

left:33%;

animation-duration:25s;

animation-delay:7s;

}

.particle:nth-child(4){

left:47%;

animation-duration:30s;

animation-delay:2s;

}

.particle:nth-child(5){

left:61%;

animation-duration:24s;

animation-delay:11s;

}

.particle:nth-child(6){

left:76%;

animation-duration:28s;

animation-delay:5s;

}

.particle:nth-child(7){

left:90%;

animation-duration:26s;

animation-delay:8s;

}

/* FADE */

@keyframes titleFade{

to{

opacity:1;

transform:translateY(0);

}

}

@keyframes textFade{

to{

opacity:1;

transform:translateY(0);

}

}

@keyframes buttonFade{

to{

opacity:1;

transform:translateY(0);

}

}

/* PANORAMA */

@keyframes panorama{

0%{

transform:translateX(0);

}

15%{

transform:translateX(0);

}

35%{

transform:translateX(-8%);

}

50%{

transform:translateX(-8%);

}

70%{

transform:translateX(-16%);

}

85%{

transform:translateX(-8%);

}

100%{

transform:translateX(0);

}

}

/* GLOW */

@keyframes titleGlow{

0%{

text-shadow:

0 0 8px rgba(255,255,255,.15);

}

34%{

text-shadow:

0 0 8px rgba(255,255,255,.15);

}

45%{

text-shadow:

0 0 18px rgba(255,255,255,.75),

0 0 35px rgba(255,60,60,.65),

0 0 70px rgba(255,0,0,.45);

}

56%{

text-shadow:

0 0 8px rgba(255,255,255,.15);

}

100%{

text-shadow:

0 0 8px rgba(255,255,255,.15);

}

}

/* PARTICLES */

@keyframes floatUp{

0%{

transform:

translateY(0)

translateX(0)

scale(.6);

opacity:0;

}

10%{

opacity:.20;

}

50%{

opacity:.26;

}

90%{

opacity:.10;

}
</head>

<body>

<section class="hero">

    <img
        src="footer.png"
        alt="Universul #TAM"
        class="hero-image">

    <div class="overlay"></div>

    <div class="particles">

        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

    </div>

    <div class="content">

        <div class="title">

            Universul

        </div>

        <div class="logo">

            #<span class="black-t">T</span><span class="split-a">A</span><span class="pink-m">M</span>

        </div>

        <div class="title">

            se construieste

        </div>

        <div class="message">

            Caramida cu caramida,<br>

            construim amintiri.

        </div>

        <a
            href="index.html"
            class="back">

            ← Inapoi in Universul #TAM

        </a>

    </div>

</section>

</body>

</html>
