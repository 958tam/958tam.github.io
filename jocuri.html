<!DOCTYPE html>
<html lang="ro">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Universul #TAM este in constructie</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap"
rel="stylesheet">

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;

}

html,body{

width:100%;
height:100%;

overflow:hidden;

font-family:Arial,sans-serif;

background:#111;

color:white;

}

body{

display:flex;

justify-content:center;

align-items:center;

}

/* HERO */

.hero{

position:relative;

width:100%;

height:100vh;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;

}

/* BACKGROUND */

.hero::before{

content:"";

position:absolute;

inset:0;

background-image:url("footer.png");

background-size:cover;

background-repeat:no-repeat;

background-position:left center;

animation:panorama 48s ease-in-out infinite;

will-change:background-position;

}

/* OVERLAY */

.hero::after{

content:"";

position:absolute;

inset:0;

background:

linear-gradient(

to bottom,

rgba(0,0,0,.10),

rgba(0,0,0,.78)

);

}

/* CONTENT */

.content{

position:relative;

z-index:20;

text-align:center;

padding:25px;

max-width:900px;

}

/* TITLE */

.title{

font-family:'Permanent Marker',cursive;

font-size:68px;

line-height:1.18;

text-shadow:

0 0 25px rgba(0,0,0,.95);

opacity:0;

transform:translateY(45px);

animation:

titleFade 1.8s ease forwards,

titleGlow 48s linear infinite;

}

/* MESSAGE */

.message{

margin-top:40px;

font-size:30px;

line-height:1.8;

color:#ececec;

opacity:0;

transform:translateY(25px);

animation:textFade 1.5s ease forwards;

animation-delay:1.2s;

animation-fill-mode:forwards;

}

/* BUTTON */

.back{

display:inline-block;

margin-top:55px;

padding:16px 34px;

border-radius:18px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(10px);

text-decoration:none;

color:white;

font-size:17px;

transition:.35s;

opacity:0;

transform:translateY(20px);

animation:

buttonFade 1.5s
  }

  /* PARTICULE */

.particles{

position:absolute;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:8;

}

.particle{

position:absolute;

bottom:-30px;

width:5px;

height:5px;

border-radius:50%;

background:rgba(255,255,255,.18);

filter:blur(.5px);

animation:floatUp linear infinite;

}

.particle:nth-child(1){

left:8%;

animation-duration:22s;

animation-delay:0s;

}

.particle:nth-child(2){

left:18%;

animation-duration:28s;

animation-delay:4s;

}

.particle:nth-child(3){

left:34%;

animation-duration:25s;

animation-delay:7s;

}

.particle:nth-child(4){

left:48%;

animation-duration:30s;

animation-delay:2s;

}

.particle:nth-child(5){

left:62%;

animation-duration:24s;

animation-delay:10s;

}

.particle:nth-child(6){

left:74%;

animation-duration:27s;

animation-delay:5s;

}

.particle:nth-child(7){

left:88%;

animation-duration:29s;

animation-delay:1s;

}

/* FADE */

@keyframes titleFade{

to{

opacity:1;

transform:translateY(0);

}

}

@keyframes textFade{

to{

opacity:1;

transform:translateY(0);

}

}

@keyframes buttonFade{

to{

opacity:1;

transform:translateY(0);

}

}

/* GLOW */

@keyframes titleGlow{

0%{

text-shadow:
0 0 25px rgba(0,0,0,.95);

}

32%{

text-shadow:
0 0 25px rgba(0,0,0,.95);

}

42%{

text-shadow:
0 0 12px rgba(255,255,255,.45),
0 0 24px rgba(255,70,70,.55),
0 0 45px rgba(255,0,0,.55);

}

52%{

text-shadow:
0 0 25px rgba(0,0,0,.95);

}

100%{

text-shadow:
0 0 25px rgba(0,0,0,.95);

}

}

/* PANORAMA */

@keyframes panorama{

0%{

background-position:left center;

}

20%{

background-position:left center;

}

40%{

background-position:center center;

}

60%{

background-position:center center;

}

80%{

background-position:right center;

}

100%{

background-position:left center;

}

}

/* PARTICLE */

@keyframes floatUp{

0%{

transform:

translateY(0)

translateX(0);

opacity:0;

}

10%{

opacity:.22;

}

70%{

opacity:.22;

}

100%{

transform:

translateY(-115vh)

translateX(40px);

opacity:0;

}

}

/* MOBILE */

@media(max-width:700px){

.title{

font-size:44px;

}

.message{

font-size:22px;

margin-top:30px;

}

.back{

margin-top:42px;

padding:14px 28px;

font-size:15px;

}

}

</style>

  </head>

<body>

<section class="hero">

    <div class="particles">

        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

    </div>

    <div class="content">

        <div class="title">

            Universul #TAM<br>
            se construiește

        </div>

        <div class="message">

            Cărămidă cu cărămidă,<br>
            construim amintiri.

        </div>

        <a
            href="index.html"
            class="back">

            ← Înapoi în Universul #TAM

        </a>

    </div>

</section>

</body>

</html>
