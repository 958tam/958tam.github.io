<!DOCTYPE html>

<html lang="ro">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Puzzle Collection | Universul #TAM</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;

}

html{

scroll-behavior:smooth;

}

body{

font-family:'Poppins',sans-serif;

background:#0b0b0b;

color:white;

overflow-x:hidden;

}

body::before{

content:"";

position:fixed;

inset:0;

background:
radial-gradient(circle at top,#c40000 0%,transparent 55%);

opacity:.14;

pointer-events:none;

z-index:-2;

}

body::after{

content:"";

position:fixed;

inset:0;

background:
linear-gradient(
180deg,
rgba(0,0,0,.15),
rgba(0,0,0,.82));

pointer-events:none;

z-index:-1;

}

/* HERO */

.hero{

position:relative;

height:82vh;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;

text-align:center;

}

.hero img{

position:absolute;

width:100%;

height:100%;

object-fit:cover;

filter:brightness(.48);

animation:heroZoom 18s ease-in-out infinite alternate;

}

@keyframes heroZoom{

from{

transform:scale(1);

}

to{

transform:scale(1.08);

}

}

.hero-overlay{

position:absolute;

inset:0;

background:

linear-gradient(

to top,

rgba(0,0,0,.82),

rgba(0,0,0,.15),

rgba(0,0,0,.75)

);

}

.hero-content{

position:relative;

z-index:2;

max-width:900px;

padding:20px;

}

.hero h1{

font-family:'Permanent Marker',cursive;

font-size:clamp(48px,8vw,86px);

color:white;

text-shadow:

0 0 35px rgba(255,0,0,.55);

margin-bottom:18px;

}

.hero p{

font-size:clamp(18px,2.8vw,28px);

font-weight:300;

color:#f1f1f1;

line-height:1.6;

}

/* SOUND BAR */

.music-bar{

display:flex;

justify-content:center;

align-items:center;

gap:5px;

margin:40px auto;

height:50px;

}

.bar{

width:8px;

height:18px;

border-radius:999px;

background:#ff2d2d;

animation:music 1s ease-in-out infinite;

}

.bar:nth-child(2){

animation-delay:.15s;

}

.bar:nth-child(3){

animation-delay:.30s;

}

.bar:nth-child(4){

animation-delay:.45s;

}

.bar:nth-child(5){

animation-delay:.60s;

}

@keyframes music{

0%,100%{

height:18px;

}

50%{

height:46px;

}

}

/* CONTENT */

.container{

width:min(1100px,92%);

margin:auto;

}

.section-title{

font-family:'Permanent Marker',cursive;

font-size:42px;

text-align:center;

margin-bottom:30px;

color:white;

text-shadow:

0 0 20px rgba(255,0,0,.35);

}

.section-text{

font-size:20px;

line-height:1.9;

text-align:center;

color:#efefef;

max-width:900px;

margin:auto;

}

</style>

</head>

<body>

<!-- HERO -->

<header class="hero">

<img src="puzzle.png">

<div class="hero-overlay"></div>

<div class="hero-content">

<h1>

Puzzle Collection

</h1>

<p>

Descoperă și completează fiecare piesă din Universul #TAM.

</p>

</div>

</header>

<!-- SOUND BAR -->

<div class="music-bar">

<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>

</div>

<audio
id="bgMusic"
loop>

<source
src="puzzle.mp3"
type="audio/mpeg">

</audio>
