<!DOCTYPE html>
<html lang="ro">

<head>
    
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Puzzle Collection | #TAM</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#111;

    color:white;

    font-family:Arial,sans-serif;

    overflow-x:hidden;
}

/* HERO */

.hero{

    position:relative;

    height:62vh;

    background:
        url('puzzle.png')
        center center/cover no-repeat;

    display:flex;

    align-items:flex-end;

    justify-content:center;
}

.overlay{

    position:absolute;

    inset:0;

    background:
    linear-gradient(
        to bottom,
        rgba(0,0,0,0.18),
        rgba(0,0,0,0.86)
    );
}

/* HERO CONTENT */

.hero-content{

    position:relative;

    z-index:2;

    width:100%;

    text-align:center;

    padding:40px 20px 60px 20px;
}

.hero-title{

    font-family:'Permanent Marker',cursive;

    font-size:58px;

    letter-spacing:2px;

    margin-bottom:12px;

    text-shadow:
        0 0 20px rgba(0,0,0,0.85);
}

.hero-subtitle{

    font-size:18px;

    color:#e6e6e6;

    letter-spacing:1px;

    text-shadow:
        0 0 12px rgba(0,0,0,0.8);
}

/* BACK BUTTON */

.back-section{

    padding:22px 20px;

    background:#121212;

    border-top:1px solid rgba(255,255,255,0.05);

    border-bottom:1px solid rgba(255,255,255,0.05);
}

.back-btn{

    display:inline-flex;

    align-items:center;

    gap:10px;

    text-decoration:none;

    color:white;

    padding:12px 18px;

    border-radius:14px;

    background:rgba(255,255,255,0.06);

    transition:.3s;

    font-size:15px;
}

.back-btn:hover{

    background:rgba(255,0,0,.18);

    transform:translateX(-4px);
}

/* MUSIC BAR */

.music-section{

    position:relative;

    height:72px;

    background:
    linear-gradient(
        to right,
        rgba(255,0,0,0.08),
        rgba(255,255,255,0.02),
        rgba(255,0,0,0.08)
    );

    border-top:1px solid rgba(255,255,255,.08);

    border-bottom:1px solid rgba(255,255,255,.08);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 14px;

    overflow:hidden;
}

.visualizer-container{

    flex:1;

    height:100%;

    display:flex;

    align-items:center;
}

#visualizer{

    width:100%;

    height:50px;

    display:block;
}

.music-btn{

    width:44px;

    height:44px;

    min-width:44px;

    margin-left:14px;

    border:none;

    border-radius:50%;

    background:rgba(255,255,255,.08);

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.3s;

    backdrop-filter:blur(10px);

    z-index:5;
}

.music-btn:hover{

    transform:scale(1.08);

    background:rgba(255,0,0,.25);
}
  /* CONTENT */

.content-section{

    padding:80px 25px 50px 25px;

    max-width:950px;

    margin:auto;

    text-align:center;
}

.content-title{

    font-family:'Permanent Marker',cursive;

    font-size:34px;

    margin-bottom:26px;

    letter-spacing:1px;
}

.content-text{

    color:#d0d0d0;

    line-height:1.9;

    font-size:18px;

    max-width:780px;

    margin:auto;
}

/* PUZZLE GRID */

.tiles-section{

    padding:15px 20px 70px 20px;

    max-width:1100px;

    margin:auto;
}

.puzzle-grid{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:28px;

    margin-top:40px;
}

</style>

</head>

<body>

<!-- HERO -->

<section class="hero">

    <div class="overlay"></div>

    <div class="hero-content">

        <div class="hero-title">

            Puzzle Collection

        </div>

        <div class="hero-subtitle">

            Descoperă și completează fiecare piesă din Universul #TAM.

        </div>

    </div>

</section>

<!-- BACK -->

<section class="back-section">

    <a href="index.html" class="back-btn">

        <i class="fas fa-arrow-left"></i>

        Înapoi acasă

    </a>

</section>

<!-- MUSIC BAR -->

<section class="music-section">

    <div class="visualizer-container">

        <canvas id="visualizer"></canvas>

    </div>

    <button class="music-btn" onclick="toggleMusic()">

        <i id="musicIcon" class="fas fa-volume-xmark"></i>

    </button>

    <audio id="bgMusic" loop autoplay crossorigin="anonymous">

        <source src="puzzle.mp3" type="audio/mpeg">

    </audio>

</section>

  <!-- CONTENT -->

<section class="content-section">

    <div class="content-title">

        Piesa cu piesa

    </div>

    <div class="content-text">

        O lume întreagă începe cu o piesă.
        În fiecare colț se ascunde un drum,
        o aventură care începe acum.

        <br><br>

        Privim imaginea și vrem mai mult.
        Vrem Universul #TAM.

    </div>

</section>

<!-- PUZZLE COLLECTION -->

<section class="tiles-section">

    <div class="content-title">

        Colectia de puzzle-uri

    </div>

    <div class="puzzle-grid">

            </div>

</section>
