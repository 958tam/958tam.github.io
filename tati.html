<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tati | #TAM</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
}

/* HERO */

.hero{

    position:relative;

    height:62vh;

    background:
        url('tati.png')
        center 16%/cover no-repeat;

    display:flex;
    align-items:flex-end;
    justify-content:center;
}

.overlay{

    position:absolute;
    inset:0;

    background:
    linear-gradient(
        to bottom,
        rgba(0,0,0,0.12),
        rgba(0,0,0,0.88)
    );
}

/* HERO CONTENT */

.hero-content{

    position:relative;
    z-index:2;

    width:100%;

    text-align:center;

    padding:40px 20px 60px 20px;
}

.hero-title{

    font-family:'Permanent Marker',cursive;

    font-size:64px;

    letter-spacing:2px;

    margin-bottom:10px;

    text-shadow:
        0 0 15px rgba(0,0,0,0.85),
        0 0 30px rgba(0,0,0,0.7);
}

.hero-subtitle{

    margin-top:10px;

    font-size:24px;

    font-family:'Permanent Marker',cursive;

    color:#000;

    -webkit-text-stroke:0.8px #ffffff;

    text-shadow:
        0 0 8px rgba(255,255,255,0.45),
        0 0 18px rgba(255,255,255,0.18);
}

/* BACK BUTTON */

.back-section{

    padding:22px 20px;

    background:#121212;

    border-top:1px solid rgba(255,255,255,0.05);

    border-bottom:1px solid rgba(255,255,255,0.05);
}

.back-btn{

    display:inline-flex;

    align-items:center;

    gap:10px;

    text-decoration:none;

    color:white;

    padding:12px 18px;

    border-radius:14px;

    background:rgba(255,255,255,0.06);

    transition:0.3s;

    font-size:15px;
}

.back-btn:hover{
    background:rgba(255,255,255,0.14);
    transform:translateX(-4px);
}

/* CONTENT */

.content-section{

    padding:80px 25px 40px 25px;

    max-width:950px;

    margin:auto;

    text-align:center;
}

.content-title{

    font-family:'Permanent Marker',cursive;

    font-size:36px;

    margin-bottom:26px;

    letter-spacing:1px;
}

.content-text{

    color:#d2d2d2;

    font-size:19px;

    line-height:1.9;

    max-width:780px;

    margin:auto;
}

/* VIDEO SECTION */

.video-section{

    padding:20px 25px 90px 25px;

    max-width:1100px;

    margin:auto;
}

.video-frame{

    position:relative;

    width:100%;

    aspect-ratio:16/9;

    border-radius:30px;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.18),
            rgba(255,255,255,0.03),
            rgba(220,220,220,0.12)
        );

    border:2px solid rgba(255,255,255,0.22);

    box-shadow:
        0 0 35px rgba(255,255,255,0.08),
        0 0 60px rgba(0,0,0,0.45);
}

.video-frame iframe{

    width:100%;

    height:100%;

    border:none;

    display:block;
}

/* FOOTER */

.footer{

    background:#0a0a0a;

    text-align:center;

    padding:55px 20px;
}

.footer-logo{

    font-family:'Permanent Marker',cursive;

    font-size:34px;

    margin-bottom:18px;

    letter-spacing:2px;
}

.footer-logo .accent{
    color:#000;
    -webkit-text-stroke:0.8px #fff;
}

/* MOBILE */

@media(max-width:700px){

    .hero{
        height:50vh;
        background-position:center center;
    }

    .hero-title{font-size:42px;}
    .hero-subtitle{font-size:18px;}

    .content-section{
        padding:60px 22px 30px 22px;
    }

    .content-title{font-size:28px;}

    .content-text{font-size:16px;}
}

</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
    <div class="overlay"></div>

    <div class="hero-content">
        <div class="hero-title">TATI</div>
        <div class="hero-subtitle">#TAM</div>
    </div>
</section>

<!-- BACK -->
<section class="back-section">
    <a href="desprenoi.html" class="back-btn">
        <i class="fas fa-arrow-left"></i>
        Înapoi la familie
    </a>
</section>

<!-- CONTENT -->
<section class="content-section">
    <div class="content-title">Povestea lui Tati</div>
    <div class="content-text">
        Dornic de aventură, gata să suprindă în imagini neprețuite orice moment.
    </div>
</section>

<!-- VIDEO -->
<section class="video-section">

    <div class="video-frame">

        <iframe
            src="https://www.youtube-nocookie.com/embed/Bznxx12Ptl0?autoplay=1&mute=1&rel=0"
            title="Video Tati"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
        </iframe>

    </div>

</section>

<!-- FOOTER -->
<footer class="footer">
    <div class="footer-logo">
        <span class="accent">T</span>AM Universe
    </div>

    <div class="footer-quote">
        Știm că este puțin, dar orice construcție se realizează în timp.
    </div>

    <div class="footer-social">
        <a href="#"><i class="fab fa-youtube"></i></a>
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-tiktok"></i></a>
    </div>

    <div class="footer-copy">
        © 2026 #TAM
    </div>
</footer>

</body>
</html>
