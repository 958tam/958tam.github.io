<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
}

/* HERO (IDENTIC) */

.hero{
    position:relative;
    height:62vh;
    background:url('tati.png') center 16%/cover no-repeat;
    display:flex;
    align-items:flex-end;
    justify-content:center;
}

.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom, rgba(0,0,0,0.12), rgba(0,0,0,0.88));
}

.hero-content{
    position:relative;
    z-index:2;
    width:100%;
    text-align:center;
    padding:40px 20px 60px 20px;
}

.hero-title{
    font-family:'Permanent Marker',cursive;
    font-size:64px;
    letter-spacing:2px;
    margin-bottom:10px;
}

.hero-subtitle{
    margin-top:10px;
    font-size:24px;
    font-family:'Permanent Marker',cursive;
    color:#000;
    -webkit-text-stroke:0.8px #ffffff;
}

/* BACK (IDENTIC) */

.back-section{
    padding:22px 20px;
    background:#121212;
    border-top:1px solid rgba(255,255,255,0.05);
    border-bottom:1px solid rgba(255,255,255,0.05);
}

.back-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:white;
    padding:12px 18px;
    border-radius:14px;
    background:rgba(255,255,255,0.06);
}

/* CONTENT (IDENTIC) */

.content-section{
    padding:80px 25px 40px 25px;
    max-width:950px;
    margin:auto;
    text-align:center;
}

.content-title{
    font-family:'Permanent Marker',cursive;
    font-size:36px;
    margin-bottom:26px;
}

.content-text{
    color:#d2d2d2;
    font-size:19px;
    line-height:1.9;
    max-width:780px;
    margin:auto;
}

/* VIDEO FIXED */

.video-section{
    padding:20px 25px 90px 25px;
    max-width:1100px;
    margin:auto;
}

.video-frame{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    border-radius:30px;
    overflow:hidden;
    background:linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.03));
    border:2px solid rgba(255,255,255,0.22);
}

.video-frame iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
}

/* FOOTER (IDENTIC - NU AM ATINS) */

.footer{
    background:#0a0a0a;
    text-align:center;
    padding:55px 20px;
}

.footer-logo{
    font-family:'Permanent Marker',cursive;
    font-size:34px;
    margin-bottom:18px;
    letter-spacing:2px;
}

.footer-logo .accent{
    color:#000;
    -webkit-text-stroke:0.8px #ffffff;
}

.footer-social{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:30px;
    flex-wrap:wrap;
}

.footer-social a{
    color:white;
    font-size:22px;
    transition:0.3s;
}

.footer-social a:hover{
    transform:scale(1.2);
    color:#fff;
}

.footer-copy{
    color:#666;
    font-size:14px;
}
