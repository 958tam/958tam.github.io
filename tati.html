<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tati | #TAM</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* (TOT CSS-ul tău rămâne IDENTIC — nu îl modific ca să nu stric designul) */

*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
}

.hero{
    position:relative;
    height:62vh;
    background:url('tati.png') center 16%/cover no-repeat;
    display:flex;
    align-items:flex-end;
    justify-content:center;
}

.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom, rgba(0,0,0,0.12), rgba(0,0,0,0.88));
}

.hero-content{
    position:relative;
    z-index:2;
    width:100%;
    text-align:center;
    padding:40px 20px 60px 20px;
}

.hero-title{
    font-family:'Permanent Marker',cursive;
    font-size:64px;
    letter-spacing:2px;
    margin-bottom:10px;
    text-shadow:0 0 15px rgba(0,0,0,0.85),0 0 30px rgba(0,0,0,0.7);
}

.hero-subtitle{
    margin-top:10px;
    font-size:24px;
    font-family:'Permanent Marker',cursive;
    color:#000;
    -webkit-text-stroke:0.8px #ffffff;
}

/* restul CSS rămâne identic */
.video-frame iframe{
    width:100%;
    height:100%;
    border:none;
}

</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
    <div class="overlay"></div>
    <div class="hero-content">
        <div class="hero-title">TATI</div>

    </div>
</section>

<!-- BACK -->
<section class="back-section">
    <a href="desprenoi.html" class="back-btn">
        <i class="fas fa-arrow-left"></i>

    </a>
</section>

<!-- CONTENT -->

    <div class="content-text">
        Dornic de aventură, gata să suprindă în imagini neprețuite orice moment.
    </div>
</section>

<!-- VIDEO -->
<section class="video-section">

    <div class="video-frame">

        <iframe
            src="https://www.youtube-nocookie.com/embed/Bznxx12Ptl0?autoplay=1&mute=1&rel=0"
            title="Tati video"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
        </iframe>

    </div>

</section>

<!-- FOOTER -->
<footer class="footer">
    <div class="footer-logo">
        <span class="accent">T</span>AM Universe
    </div>
    <div class="footer-quote">
        Știm că este puțin, dar orice construcție se realizează în timp.
